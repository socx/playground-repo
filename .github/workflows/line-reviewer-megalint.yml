name: MegaLinter with Reviewdog Suggester

on:
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  megalinter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Run MegaLinter in "report only" mode so it produces fix suggestions
      - name: Run MegaLinter
        uses: oxsecurity/megalinter@latest
        env:
          # Enable all linters or restrict to YAML/Terraform/Markdown
          ENABLE: YAML,TERRAFORM,MARKDOWN
          # Generate fix files but don't apply them automatically
          APPLY_FIXES: none
          # Save reports to workspace
          REPORT_OUTPUT_FOLDER: megalinter-reports

      # Use reviewdog/action-suggester to comment suggested fixes on PR
      - name: Suggest fixes with reviewdog
        if: always()
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: megalinter
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
